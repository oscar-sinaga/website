<style>
/* Layout: exam-console — sticky status bar, question sheet on the left, answer-grid navigator on the right; stacks on phones. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#13202E; --muted:#56657A; --line:#D3DCE4;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#D7EEF0;
  --good:#1D7A4C; --good-soft:#DDF1E6; --bad:#B42330; --bad-soft:#F9E0E2; --flag:#A86A12; --flag-soft:#F7EAD2;
  --d1:#0B6E78; --d2:#7A3E9D; --d3:#2F5FB3; --d4:#A86A12;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#141E28; --sunk:#1B2733; --ink:#E4EBF2; --muted:#93A2B4; --line:#273544;
  --accent:#3DB5C1; --accent-ink:#06191C; --accent-soft:#12343A;
  --good:#4CC48A; --good-soft:#123326; --bad:#F27C85; --bad-soft:#3A1A1E; --flag:#E3AA52; --flag-soft:#3A2A12;
  --d1:#3DB5C1; --d2:#B88AD6; --d3:#7FA6EE; --d4:#E3AA52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#141E28; --sunk:#1B2733; --ink:#E4EBF2; --muted:#93A2B4; --line:#273544;
  --accent:#3DB5C1; --accent-ink:#06191C; --accent-soft:#12343A;
  --good:#4CC48A; --good-soft:#123326; --bad:#F27C85; --bad-soft:#3A1A1E; --flag:#E3AA52; --flag-soft:#3A2A12;
  --d1:#3DB5C1; --d2:#B88AD6; --d3:#7FA6EE; --d4:#E3AA52; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer;background:none;border:0;padding:0}
.brand .code{font-family:var(--f-mono);font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.top .spacer{flex:1}
.timer{font-family:var(--f-mono);font-weight:700;font-size:18px;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{height:3px;background:var(--sunk)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd{font-family:var(--f-mono);font-size:11px;opacity:.7}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.hero h1{font-size:clamp(30px,4.6vw,46px);letter-spacing:-.02em}
.hero p.lead{color:var(--muted);max-width:60ch;font-size:17px;margin:12px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:22px}
.fact b{display:block;font-family:var(--f-mono);font-size:22px}
.fact span{font-size:13px;color:var(--muted)}
.resume{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--flag-soft);border:1px solid var(--flag);border-radius:var(--r);padding:12px 16px}
.resume p{margin:0;flex:1;min-width:200px}

.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:36px 0 14px}
.sec-h h2{font-size:22px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.exams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.ex .num{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.ex .num small{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.ex .best{font-size:13px;color:var(--muted);min-height:2.6em}
.ex .best b{font-family:var(--f-mono);color:var(--ink);font-size:15px}
.ex .comp{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.ex .btn{margin-top:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.pill.new{background:var(--sunk);color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:19px}
.panel p{margin:0;color:var(--muted);font-size:15px}
.panel .btn{align-self:flex-start;margin-top:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dom:first-of-type{border-top:0}
.dom .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dom .nm{font-weight:600;font-size:15px}
.dom .w{font-family:var(--f-mono);font-weight:700}
.dom .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.dom .bar i{display:block;height:100%}
.note{font-size:13px;color:var(--muted);margin:0}
.weak{display:flex;flex-direction:column;gap:6px}
.weak .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:14px}
.weak .row b{font-family:var(--f-mono)}

.hist-table{width:100%;border-collapse:collapse;font-size:14px}
.hist-table td,.hist-table th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.hist-table th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* question */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.qno{font-family:var(--f-mono);font-weight:700}
.dtag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.ttag{font-size:12px;color:var(--muted)}
.qtext{font-size:19px;line-height:1.5;margin:0 0 6px;max-width:72ch}
.qhint{font-size:14px;color:var(--muted);margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.optw{display:flex;flex-direction:column}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .lt{font-family:var(--f-mono);font-weight:700;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.opt.multi .lt{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .lt{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .lt{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .lt{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .mark{font-size:12px;font-weight:700;align-self:center;white-space:nowrap}
.opt.ok .mark{color:var(--good)}
.opt.no .mark{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:14.5px;color:var(--muted);margin:6px 0 2px 56px;max-width:68ch;line-height:1.5}
.why.ok{color:var(--ink)}
.explain{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.explain .verdict{font-weight:700}
.explain .verdict.ok{color:var(--good)}
.explain .verdict.no{color:var(--bad)}
.explain p{margin:0;max-width:72ch}
.tip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:15px;max-width:72ch}
.tip b{color:var(--accent);font-size:12px;letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.actions .spacer{flex:1}

.nav{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.nav h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.cell{font-family:var(--f-mono);font-size:12px;aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;padding:0;position:relative}
.cell.ans{background:var(--accent-soft);border-color:var(--accent)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.ok{background:var(--good-soft);border-color:var(--good)}
.cell.no{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.counts{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.counts b{color:var(--ink);font-family:var(--f-mono)}
.confirm{margin-top:14px;background:var(--flag-soft);border:1px solid var(--flag);border-radius:8px;padding:12px;font-size:14px}
.confirm .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* result */
.result-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.gauge{width:170px;height:170px;max-width:100%}
.gauge text{font-family:var(--f-mono)}
.result-head h1{font-size:clamp(26px,3.6vw,36px)}
.result-head p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:16px}
.stats div b{display:block;font-family:var(--f-mono);font-size:20px}
.stats div span{font-size:13px;color:var(--muted)}
.breakdown{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.breakdown h2{font-size:18px;margin-bottom:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 110px 60px;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.brow .bar i{display:block;height:100%}
.brow .bar .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.brow .ct{font-family:var(--f-mono);color:var(--muted);text-align:right}
.brow .pc{font-family:var(--f-mono);font-weight:700;text-align:right}
.brow .tagw{font-size:12px;font-weight:700;margin-left:8px}
.topics{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px}
.review-list{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;align-items:center}
.loaderr{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:16px}

@media (max-width:1000px){
  .exams{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .exam{grid-template-columns:minmax(0,1fr)}
  .nav{position:static}
  .grid{grid-template-columns:repeat(10,minmax(0,1fr))}
}
@media (max-width:620px){
  .exams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .result-head{grid-template-columns:minmax(0,1fr);justify-items:start}
  .sheet{padding:18px}
  .qtext{font-size:17px}
  .why{margin-left:0}
  .grid{grid-template-columns:repeat(8,minmax(0,1fr))}
  .brow{grid-template-columns:minmax(0,1fr) 70px 50px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const EXAMS = window.CLF_EXAMS || [];
const POOL = EXAMS.flatMap(ex => ex.qs.map(q => ({...q, ex:ex.id})));
const DOMAINS = {
  1:{name:"Cloud Concepts",w:24,c:"var(--d1)"},
  2:{name:"Security and Compliance",w:30,c:"var(--d2)"},
  3:{name:"Cloud Technology and Services",w:34,c:"var(--d3)"},
  4:{name:"Billing, Pricing, and Support",w:12,c:"var(--d4)"}
};
const EXAM_MIN = 90, PASS = 700, L = "ABCDEFGH";
const PASS_PCT = (PASS-100)/900;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sameSet = (x,y) => x.length===y.length && x.every(v=>y.includes(v));
const fmtTime = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(ss).padStart(2,"0"); };
const scaled = pct => Math.round(100 + 900*pct);
const pad2 = n => String(n).padStart(2,"0");
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* Shuffle one question's options and carry the answer key and per-option reasons along. */
function prep(src){
  const order = shuffle(src.o.map((_,i)=>i));
  return { ...src, o:order.map(i=>src.o[i]), r:order.map(i=>src.r[i]), a:order.map((orig,ni)=>src.a.includes(orig)?ni:-1).filter(i=>i>=0) };
}

/* ---------------- state ---------------- */
let S = { screen:"home", prefs:{domains:[1,2,3,4], n:20}, warm:null };
let tick = null;

function begin(mode, qs, examId){
  S = { ...S, screen:"run", mode, examId:examId||null, qs, ans:{}, flags:[], cur:0, revealed:{}, startAt:Date.now(),
        endAt: mode==="exam" ? Date.now()+EXAM_MIN*60000 : null, confirm:false };
  render(); startTick(); window.scrollTo(0,0);
}
function startExam(id){ const ex = EXAMS.find(e=>e.id===id); if (ex) begin("exam", ex.qs.map(prep), id); }
function startPractice(){
  const pool = POOL.filter(q=>S.prefs.domains.includes(q.d));
  const n = S.prefs.n==="all" ? pool.length : Math.min(S.prefs.n, pool.length);
  if (n) begin("practice", shuffle(pool).slice(0,n).map(prep));
}
function startWrongOnly(){
  const wrong = new Set(store("clf_wrong") || []);
  const qs = POOL.filter(q=>wrong.has(q.id));
  if (qs.length) begin("practice", shuffle(qs).map(prep));
}
function startTick(){ clearInterval(tick); tick = setInterval(()=>{ if(S.screen!=="run") return clearInterval(tick); paintTimer(); if(S.endAt && Date.now()>=S.endAt) finish(true); }, 1000); }
function saveRun(){ if (S.screen==="run") store("clf_run", { mode:S.mode, examId:S.examId, qs:S.qs, ans:S.ans, flags:S.flags, cur:S.cur, revealed:S.revealed, startAt:S.startAt, endAt:S.endAt }); }

function finish(timeUp){
  clearInterval(tick);
  const res = {1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}};
  let correct = 0; const missedTopics = {};
  const wrong = new Set(store("clf_wrong") || []);
  S.qs.forEach((q,i)=>{
    const ok = sameSet(S.ans[i]||[], q.a); res[q.d].t++;
    if (ok){ res[q.d].c++; correct++; wrong.delete(q.id); }
    else { wrong.add(q.id); missedTopics[q.t] = (missedTopics[q.t]||0)+1; }
  });
  store("clf_wrong", Array.from(wrong));
  const pct = correct/S.qs.length;
  S.result = { correct, total:S.qs.length, pct, score:scaled(pct), dom:res, used:Math.round((Date.now()-S.startAt)/1000), timeUp:!!timeUp,
               topics:Object.entries(missedTopics).sort((a,b)=>b[1]-a[1]).slice(0,10) };
  S.screen = "result"; S.filter = "wrong";
  const hist = store("clf_hist") || [];
  hist.unshift({ t:Date.now(), mode:S.mode, ex:S.examId, score:S.result.score, correct, total:S.qs.length, used:S.result.used,
                 dom:Object.fromEntries(Object.entries(res).map(([d,x])=>[d,[x.c,x.t]])) });
  store("clf_hist", hist.slice(0,60));
  store("clf_run", null);
  render(); window.scrollTo(0,0);
}

/* ---------------- rendering ---------------- */
function render(){
  renderTop();
  const app = $("#app");
  if (!EXAMS.length) { app.innerHTML = `<div class="loaderr"><b>Bank soal tidak berhasil dimuat.</b> Periksa koneksi dan coba <a href="./">muat ulang halaman ujian</a>, atau kembali ke <a href="../">AWS Mock Exams</a>.</div>`; return; }
  if (S.screen==="home") app.innerHTML = homeHTML();
  else if (S.screen==="run") app.innerHTML = runHTML();
  else if (S.screen==="result") app.innerHTML = resultHTML();
  paintTimer(); saveRun();
}

function renderTop(){
  const run = S.screen==="run";
  let right = `<a class="btn ghost sm" href="materi.html">Materi</a>`;
  if (run) {
    right = `<span class="eyebrow hide-sm">${S.mode==="exam"?`Mock Exam ${pad2(S.examId)}`:"Mode latihan"}</span>

      <button class="btn ghost sm" data-act="pause">Jeda</button>`;

    right += `<button class="btn ghost sm" data-act="home">Beranda</button>`;
  }

function paintTimer(){
  const el = $("#timer"); if(!el) return;

}

      <tbody>${hist.slice(0,15).map(h=>`<tr>

  return `

function questionCard(q, sel, shown, ctx, num){
  const multi = q.a.length>1;
  const opts = q.o.map((t,i)=>{
    let cls = "opt"+(multi?" multi":""), mark = "";
    const isAns = q.a.includes(i), picked = sel.includes(i);
    if (shown){ if(isAns){cls+=" ok"; mark=picked?"Jawabanmu · benar":"Jawaban benar";} else if(picked){cls+=" no"; mark="Jawabanmu";} }
    const why = shown && q.r ? `<div class="why ${isAns?"ok":""}">${esc(q.r[i])}</div>` : "";
    return `<div class="optw"><button class="${cls}" data-act="pick" data-ctx="${ctx}" data-i="${i}" aria-pressed="${!shown && picked}" ${shown?"disabled":""}>
      <span class="lt">${L[i]}</span><span>${esc(t)}</span><span class="mark">${mark}</span></button>${why}</div>`;
  }).join("");
  const ok = sameSet(sel, q.a);
  const explain = shown ? `<div class="explain">
      <div class="verdict ${ok?"ok":"no"}">${ok?"Benar.":(sel.length?"Kurang tepat.":"Tidak dijawab.")} Jawaban: ${q.a.map(i=>L[i]).join(", ")}</div>
      <p>${esc(q.e)}</p>
      <div class="tip"><b>Tips ujian</b>${esc(q.k)}</div></div>` : "";
  const dm = DOMAINS[q.d];
  const head = `<div class="qhead">${num?`<span class="qno">${num}</span>`:""}<span class="dtag" style="color:${dm.c}">D${q.d} · ${dm.name}</span>${shown?`<span class="ttag">${q.ts?`Task ${esc(q.ts)} · `:""}${esc(q.t)}</span>`:""}</div>`;
  let actions = "";
  if (ctx==="warm") actions = `<div class="actions">${shown?`<button class="btn" data-act="warmnext">Soal lain</button>`:`<button class="btn primary" data-act="warmcheck" ${sel.length?"":"disabled"}>Cek jawaban</button>`}</div>`;
  return `<div class="sheet">${head}<p class="qtext">${esc(q.q)}</p><p class="qhint">${multi?`Pilih ${q.a.length} jawaban.`:"Pilih 1 jawaban."}</p><div class="opts">${opts}</div>${explain}${actions}</div>`;
}

function runHTML(){
  const i = S.cur, q = S.qs[i], sel = S.ans[i]||[], shown = !!S.revealed[i];
  const flagged = S.flags.includes(i), last = i===S.qs.length-1;
  const answered = S.qs.filter((_,k)=>(S.ans[k]||[]).length).length;
  const card = questionCard(q, sel, shown, "run", `${i+1} / ${S.qs.length}`);
  let act;
  if (S.mode==="practice"){
    act = `<button class="btn" data-act="prev" ${i?"":"disabled"}>Sebelumnya</button><span class="spacer"></span>
      ${shown ? (last?`<button class="btn primary" data-act="finish">Lihat hasil</button>`:`<button class="btn primary" data-act="next">Berikutnya <kbd>N</kbd></button>`)
              : `<button class="btn primary" data-act="check" ${sel.length?"":"disabled"}>Cek jawaban <kbd>Enter</kbd></button>`}`;
  } else {
    act = `<button class="btn" data-act="prev" ${i?"":"disabled"}>Sebelumnya <kbd>P</kbd></button>
      <button class="btn ${flagged?"flagged":""}" data-act="flag">${flagged?"Ditandai":"Tandai untuk ditinjau"} <kbd>F</kbd></button>
      <span class="spacer"></span>
      ${last?`<button class="btn primary" data-act="askfinish">Selesai</button>`:`<button class="btn primary" data-act="next">Berikutnya <kbd>N</kbd></button>`}`;
  }
  const cells = S.qs.map((qq,k)=>{
    let c = "cell";
    if (S.mode==="practice" && S.revealed[k]) c += sameSet(S.ans[k]||[], qq.a)?" ok":" no";
    else if ((S.ans[k]||[]).length) c += " ans";
    if (S.flags.includes(k)) c += " flg";
    if (k===i) c += " cur";
    return `<button class="${c}" data-act="go" data-i="${k}" aria-label="Soal ${k+1}">${k+1}</button>`;
  }).join("");
  const unanswered = S.qs.length - answered;
  const confirm = S.confirm ? `<div class="confirm">${unanswered?`<b>${unanswered} soal belum dijawab.</b> `:""}${S.flags.length?`${S.flags.length} soal masih ditandai. `:""}Kumpulkan ujian sekarang?
      <div class="row"><button class="btn primary" data-act="finish">Kumpulkan</button><button class="btn" data-act="cancelfinish">Kembali ke soal</button></div></div>` : "";
  const legend = S.mode==="exam"
    ? `<span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Dijawab</span><span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>Ditandai</span><span><i></i>Kosong</span>`
    : `<span><i style="background:var(--good-soft);border-color:var(--good)"></i>Benar</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Salah</span><span><i></i>Belum</span>`;
  return `<div class="exam">
    <div>${card}<div class="actions">${act}</div></div>
    <aside class="nav">
      <h3>Navigasi soal</h3>
      <div class="grid">${cells}</div>
      <div class="legend">${legend}</div>
      <div class="counts"><span>Dijawab <b>${answered}</b></span><span>Ditandai <b>${S.flags.length}</b></span><span>Sisa <b>${unanswered}</b></span></div>
      ${S.mode==="exam"?`<div class="actions" style="margin-top:12px"><button class="btn" data-act="askfinish" style="width:100%">Selesai &amp; kumpulkan</button></div>${confirm}`:`<div class="actions" style="margin-top:12px"><button class="btn" data-act="finish" style="width:100%">Akhiri &amp; lihat hasil</button></div>`}
    </aside></div>`;
}

function gauge(score){
  const r = 70, c = 2*Math.PI*r, frac = (score-100)/900;
  const a = PASS_PCT*2*Math.PI - Math.PI/2, px = 85 + r*Math.cos(a), py = 85 + r*Math.sin(a);
  const col = score>=PASS ? "var(--good)" : "var(--bad)";
  return `<svg class="gauge" viewBox="0 0 170 170" role="img" aria-label="Skor ${score} dari 1000">
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
    <circle cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c*frac} ${c}" transform="rotate(-90 85 85)"/>
    <circle cx="${px}" cy="${py}" r="4" fill="var(--ink)"/>
    <text x="85" y="88" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">${score}</text>
    <text x="85" y="112" text-anchor="middle" font-size="11" fill="var(--muted)">dari 1000 · lulus ${PASS}</text>
  </svg>`;
}

function resultHTML(){
  const R = S.result, pass = R.score>=PASS;
  const rows = [1,2,3,4].filter(d=>R.dom[d].t).map(d=>{
    const x = R.dom[d], p = x.c/x.t, weak = p < PASS_PCT;
    return `<div class="brow">
      <span><b>D${d}</b> ${DOMAINS[d].name}<span class="tagw" style="color:${weak?"var(--bad)":"var(--good)"}">${weak?"Perlu latihan":"Aman"}</span></span>
      <span class="ct">${x.c} / ${x.t}</span><span class="pc">${Math.round(p*100)}%</span>
      <div class="bar"><i style="width:${p*100}%;background:${DOMAINS[d].c}"></i><span class="th" style="left:${PASS_PCT*100}%"></span></div>
    </div>`;}).join("");
  const f = S.filter;
  const list = S.qs.map((q,i)=>({q,i,sel:S.ans[i]||[]})).filter(x=>{
    const ok = sameSet(x.sel,x.q.a);
    return f==="all" || (f==="wrong"&&!ok) || (f==="flag"&&S.flags.includes(x.i)) || (f==="right"&&ok);
  });
  const wrongN = S.qs.length - R.correct;
  const fchip = (k,label)=>`<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${label}</button>`;
  const title = S.mode==="exam" ? `Hasil Mock Exam ${pad2(S.examId)}` : "Hasil latihan";
  const next = S.mode==="exam" && S.examId < EXAMS.length ? `<button class="btn" data-act="exam" data-id="${S.examId+1}">Lanjut ke Mock Exam ${pad2(S.examId+1)}</button>` : "";
  return `
  <section class="result-head">
    ${gauge(R.score)}
    <div>
      <div class="eyebrow">${title}${R.timeUp?" · waktu habis":""}</div>
      <h1 style="margin-top:6px">${pass?"Lulus. Skor di atas batas 700.":"Belum lulus. Fokus ke domain yang merah."}</h1>
      <p>${pass?"Baca ulang pembahasan soal yang salah, lalu lanjut ke paket berikutnya. Skor yang stabil di atas 800 di beberapa paket adalah tanda siap ujian.":"Baca pembahasan setiap soal yang salah sampai paham alasan tiap opsi, pelajari bagian materi untuk topik di bawah, lalu ulangi paket ini."}</p>
      <div class="stats">
        <div><b>${R.correct}/${R.total}</b><span>jawaban benar</span></div>
        <div><b>${Math.round(R.pct*100)}%</b><span>akurasi</span></div>
        <div><b>${fmtTime(R.used)}</b><span>waktu terpakai</span></div>
      </div>
      <div class="actions">
        ${S.mode==="exam"?`<button class="btn primary" data-act="exam" data-id="${S.examId}">Ulangi paket ini</button>${next}`:`<button class="btn primary" data-act="practice">Latihan lagi</button>`}
        <a class="btn" href="materi.html">Buka materi</a>
      </div>
    </div>
  </section>
  <section class="breakdown"><h2>Per domain</h2><p class="note" style="margin:0 0 6px">Garis vertikal menandai ambang perkiraan lulus (≈67%).</p>${rows}
    ${R.topics.length?`<div class="eyebrow" style="margin-top:16px">Topik yang perlu dipelajari ulang</div><div class="topics">${R.topics.map(([t,n])=>`<span>${esc(t)}${n>1?` ×${n}`:""}</span>`).join("")}</div>`:""}
  </section>
  <div class="filters"><span class="eyebrow" style="margin-right:6px">Pembahasan</span>
    ${fchip("wrong",`Salah (${wrongN})`)}${fchip("right",`Benar (${R.correct})`)}${S.flags.length?fchip("flag",`Ditandai (${S.flags.length})`):""}${fchip("all","Semua")}</div>
  <div class="review-list">${list.length?list.map(x=>questionCard(x.q,x.sel,true,"review",`Soal ${x.i+1}`)).join(""):`<p class="note">Tidak ada soal di filter ini.</p>`}</div>`;
}

/* ---------------- interaction ---------------- */
function pick(ctx, i){
  const target = ctx==="warm" ? S.warm : null;
  const q = target ? target.q : S.qs[S.cur];
  const sel = (target ? target.sel : (S.ans[S.cur]||[])).slice();
  if (q.a.length===1) { sel.length=0; sel.push(i); }
  else { const at = sel.indexOf(i); if (at>=0) sel.splice(at,1); else { if (sel.length>=q.a.length) sel.shift(); sel.push(i); } }
  if (target) target.sel = sel; else S.ans[S.cur] = sel;
  render();
}
function go(k){ if(k<0||k>=S.qs.length) return; S.cur=k; S.confirm=false; render(); window.scrollTo({top:0}); }
function toggleFlag(){ const at=S.flags.indexOf(S.cur); at>=0?S.flags.splice(at,1):S.flags.push(S.cur); render(); }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "home": case "pause": saveRun(); clearInterval(tick); S.screen="home"; S.warm=null; render(); window.scrollTo(0,0); break;
    case "resume": { const r = store("clf_run"); if(r){ S = { ...S, ...r, screen:"run", confirm:false }; if (S.endAt && Date.now()>=S.endAt) finish(true); else { render(); startTick(); } } break; }
    case "discard": store("clf_run", null); render(); break;
    case "exam": startExam(+b.dataset.id); break;
    case "practice": startPractice(); break;
    case "wrongonly": startWrongOnly(); break;
    case "dom": { const d=+b.dataset.d, ds=S.prefs.domains; S.prefs.domains = ds.includes(d)?ds.filter(x=>x!==d):ds.concat(d).sort(); store("clf_prefs",S.prefs); render(); break; }
    case "n": { const n=b.dataset.n; S.prefs.n = n==="all"?"all":+n; store("clf_prefs",S.prefs); render(); break; }
    case "pick": if(b.dataset.ctx!=="review") pick(b.dataset.ctx, +b.dataset.i); break;
    case "warmcheck": S.warm.shown=true; render(); break;
    case "warmnext": S.warm=null; render(); break;
    case "check": S.revealed[S.cur]=true; render(); break;
    case "next": go(S.cur+1); break;
    case "prev": go(S.cur-1); break;
    case "go": go(+b.dataset.i); break;
    case "flag": toggleFlag(); break;
    case "askfinish": S.confirm=true; render(); break;
    case "cancelfinish": S.confirm=false; render(); break;
    case "finish": finish(false); break;
    case "filter": S.filter=b.dataset.f; render(); break;
  }
});

document.addEventListener("keydown", e=>{
  if (S.screen!=="run" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), q = S.qs[S.cur], shown = !!S.revealed[S.cur];
  const li = "abcdefgh".indexOf(k), ni = "12345678".indexOf(k), idx = li>=0?li:ni;
  if (idx>=0 && idx<q.o.length && !shown){ pick("run", idx); e.preventDefault(); }
  else if (k==="n" || e.key==="ArrowRight"){ go(S.cur+1); }
  else if (k==="p" || e.key==="ArrowLeft"){ go(S.cur-1); }
  else if (k==="f" && S.mode==="exam"){ toggleFlag(); }
  else if (e.key==="Enter" && S.mode==="practice" && !shown && (S.ans[S.cur]||[]).length && !e.target.closest("button")){ S.revealed[S.cur]=true; render(); }
});

/* ---------------- boot ---------------- */
function start(data){
  const p = store("clf_prefs"); if (p && Array.isArray(p.domains)) S.prefs = p;
  if (data && data.S && data.S.screen) { S = data.S; if (S.screen==="run") startTick(); }
  render();
}
window.claude?.hot?.snapshot?.(()=>({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
